services:
  db:
    # S4: the same major as production (deploy/docker-compose.yml) and CI.
    # Moving an existing dbdata volume from the old mysql:8.0 image to 8.4 is
    # a one-way, in-place upgrade on first start: dump it first if you need
    # to go back, or start clean with `docker compose down -v`.
    image: mysql:8.4
    container_name: safeer-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: safeer
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 3308, not african_api's 3307 — the two sibling repos' docker-compose
    # stacks can then run at the same time on one machine without a port
    # clash. Bound to 127.0.0.1 only (C47): the root password below is a
    # well-known dev value, so the port must not be reachable from the LAN.
    ports: ["127.0.0.1:3308:3306"]
    volumes: ["dbdata:/var/lib/mysql"]
  mail:
    image: mailhog/mailhog
    container_name: safeer-mailhog
    ports: ["127.0.0.1:9026:8025", "127.0.0.1:1026:1025"]
volumes: { dbdata: }
