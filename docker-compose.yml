services:
  db:
    image: mysql:8.0
    container_name: safeer-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: safeer
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 3308, not african_api's 3307 — the two sibling repos' docker-compose
    # stacks can then run at the same time on one machine without a port
    # clash.
    ports: ["3308:3306"]
    volumes: ["dbdata:/var/lib/mysql"]
  mail:
    image: mailhog/mailhog
    container_name: safeer-mailhog
    ports: ["9026:8025", "1026:1025"]
volumes: { dbdata: }
