<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جمعية سفير الدعوية — نموذج تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --primary:#0B4343; --primary-dark:#063333; --secondary:#1C8184; --sl:#DDF2F1;
  --bg:#FFFFFF; --surface:#F6FAF9; --card:#FFFFFF; --text:#183333; --muted:#4F6B6B;
  --border:#DCE8E7; --decor:#668080; --on-primary:#FFFFFF;
  --alert:#B4532A; --alert-bg:#FFF0E8; --alert-br:#E8D5CB; --alert-tx:#8A3D1E;
  --ok:#1E6B3C; --ok-bg:#E4F3E9;
  --logo1:#0B4343; --logo2:#1C8184; --hero:#F6FAF9; --band:#0B4343; --band-tx:#FFFFFF;
  --band-soft:#C9E6E4; --band-dim:#8FC9C7; --band-card:#063333;
  --raise:#EEF6F5; --app-bg:#F6FAF9; --thead:#F6FAF9; --sidebar:#063333;
  --badge-tx:#FFFFFF; --onband-bg:#FFFFFF; --onband-tx:#0B4343;
  --shadow-sm:0 2px 16px rgba(11,67,67,.07); --shadow-md:0 14px 34px rgba(11,67,67,.10);
  --r-card:20px; --r-btn:10px; --pad:60px; --maxw:1280px;
}
[data-theme="dark"]{
  /* elevation ladder: bg < surface < card < raise */
  --bg:#06191B; --surface:#0C2326; --card:#102A2D; --raise:#16373A; --border:#1F4649;
  --text:#E9F4F3; --muted:#9DB7B6; --decor:#6E9190;
  --primary:#3FB8B4; --primary-dark:#57C9C5; --secondary:#6ED3CE; --on-primary:#052021;
  --sl:#173538;
  --alert:#E08B63; --alert-bg:#3A2017; --alert-br:#5C3524; --alert-tx:#F3BFA5;
  --ok:#74CE95; --ok-bg:#12331F;
  --logo1:#E9F4F3; --logo2:#6ED3CE; --hero:#0A2326;
  --band:#0A2E31; --band-tx:#EAF6F5; --band-soft:#A9C9C7; --band-dim:#6ED3CE; --band-card:#0F3A3D;
  --app-bg:#0A1F21; --thead:#16373A; --sidebar:#041214;
  --badge-tx:#052021; --onband-bg:#3FB8B4; --onband-tx:#052021;
  --shadow-sm:0 2px 16px rgba(0,0,0,.45); --shadow-md:0 16px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:17px; line-height:1.85; -webkit-font-smoothing:antialiased;
}
html[dir="ltr"] body{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif}
a{color:var(--secondary); text-decoration:none}
a:hover{color:var(--primary)}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
h1,h2,h3,h4{margin:0; line-height:1.35; font-weight:600; color:var(--primary)}
[data-theme="dark"] h1,[data-theme="dark"] h2,[data-theme="dark"] h3,[data-theme="dark"] h4{color:var(--text)}
p{margin:0}
.ltr{direction:ltr; text-align:right; font-family:'IBM Plex Sans',sans-serif}
html[dir="ltr"] .ltr{text-align:left}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--pad)}
.sec{padding:96px 0}
.sec.tight{padding:64px 0}
.sec.surface{background:var(--surface)}
.sec.band{background:var(--band); color:var(--band-tx)}
.sec.band h1,.sec.band h2,.sec.band h3{color:var(--band-tx)}
.row{display:flex; gap:24px}
.row.mid{align-items:center}
.row.end{align-items:flex-end}
.col{display:flex; flex-direction:column}
.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}.g32{gap:32px}.g40{gap:40px}
.grow{flex-grow:1}
.spread{display:flex; align-items:center; justify-content:space-between; gap:24px}
.grid{display:grid; gap:24px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}

/* ---------- type ---------- */
.display{font-size:clamp(34px,4.2vw,60px); font-weight:700; line-height:1.3}
.h1{font-size:clamp(30px,3.4vw,48px); font-weight:700}
.h2{font-size:clamp(26px,2.9vw,40px)}
.h3{font-size:clamp(20px,1.6vw,24px)}
.lead{font-size:19px; line-height:1.85; color:var(--muted)}
.sec.band .lead,.band-soft{color:var(--band-soft)}
.muted{color:var(--muted)}
.small{font-size:14px}
.cap{font-size:13px; color:var(--muted)}
.eyebrow{font-size:14px; font-weight:600; letter-spacing:.08em; color:var(--secondary)}
.sec.band .eyebrow{color:var(--band-dim)}

/* ---------- components ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; white-space:nowrap;
  min-height:52px; padding:0 28px; border-radius:var(--r-btn); border:none;
  background:var(--primary); color:var(--on-primary); font-size:16px; font-weight:600;
  cursor:pointer; transition:background .2s, transform .2s}
.btn:hover{background:var(--primary-dark); color:var(--on-primary); transform:translateY(-1px)}
.btn.sm{min-height:44px; padding:0 20px; font-size:15px}
.btn.xs{min-height:38px; padding:0 16px; font-size:14px; border-radius:8px}
.btn.ghost{background:transparent; color:var(--primary); border:1.5px solid var(--primary)}
.btn.ghost:hover{background:var(--sl); color:var(--primary)}
.btn.soft{background:var(--sl); color:var(--primary)}
.btn.soft:hover{background:var(--sl); filter:brightness(.96); color:var(--primary)}
.btn.line{background:var(--card); color:var(--text); border:1px solid var(--border); font-weight:600}
.btn.line:hover{background:var(--raise); color:var(--text)}
.btn.danger{background:var(--alert); color:var(--badge-tx)}
.btn.danger:hover{background:var(--alert); filter:brightness(.92)}
.btn.onband{background:var(--onband-bg); color:var(--onband-tx)}
.btn.onband:hover{background:var(--onband-bg); color:var(--onband-tx); filter:brightness(.95)}
.btn.onband-ghost{background:transparent; color:var(--band-tx); border:1.5px solid var(--band-dim)}
.btn.onband-ghost:hover{background:rgba(255,255,255,.08); color:var(--band-tx)}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--r-card); padding:32px}
.card.pad0{padding:0; overflow:hidden}
.card.hover{transition:transform .28s, border-color .28s, box-shadow .28s}
.card.hover:hover{transform:translateY(-4px); border-color:var(--secondary); box-shadow:var(--shadow-md)}
.tile{background:var(--raise); border-radius:14px; padding:18px 22px}

.pill{display:inline-flex; align-items:center; padding:6px 13px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap}
.pill.teal{background:var(--sl); color:var(--primary)}
[data-theme="dark"] .pill.teal{color:var(--text)}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.warn{background:var(--alert-bg); color:var(--alert-tx)}
.pill.plain{background:var(--raise); border:1px solid var(--border); color:var(--muted)}
.pill.solid{background:var(--secondary); color:var(--on-primary)}

.chip{display:inline-flex; align-items:center; min-height:42px; padding:0 20px; border-radius:999px;
  background:var(--card); border:1px solid var(--border); color:var(--text);
  font-size:15px; font-weight:500; cursor:pointer}
.chip.on{background:var(--primary); color:var(--on-primary); border-color:var(--primary); font-weight:600}

.ico{width:54px; height:54px; border-radius:16px; background:var(--sl);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--secondary)}
.ico.sm{width:44px; height:44px; border-radius:12px}
.ico.lg{width:60px; height:60px; border-radius:18px}

.ph{background:var(--sl); border-radius:var(--r-card); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:12px; color:var(--primary);
  font-size:15px; font-weight:600; text-align:center; padding:20px}
.ph.dim{background:var(--surface); border:1px solid var(--border); color:var(--muted)}

label{font-size:15px; font-weight:600; color:var(--text)}
.field{display:flex; flex-direction:column; gap:8px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],
input[type=search],input[type=password],select,textarea{
  min-height:52px; padding:0 16px; border:1px solid var(--border); border-radius:var(--r-btn);
  background:var(--card); color:var(--text); font-size:16px; width:100%}
textarea{padding:14px 16px; line-height:1.8; min-height:120px; resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--secondary); outline-offset:1px}
input::placeholder,textarea::placeholder{color:var(--decor); opacity:1}
.req{color:var(--alert)}
.check{display:flex; gap:14px; align-items:center; min-height:56px; padding:0 22px;
  border:1px solid var(--border); border-radius:12px; background:var(--card); cursor:pointer; font-weight:500}
.check.on{border:1.5px solid var(--secondary); background:var(--sl); font-weight:600; color:var(--primary)}
[data-theme="dark"] .check.on{color:var(--text)}
input[type=radio],input[type=checkbox]{width:20px; height:20px; accent-color:var(--primary); min-height:0}

.note{display:flex; gap:16px; align-items:flex-start; padding:22px 26px; border-radius:14px;
  background:var(--sl); color:var(--primary); font-size:15px; line-height:1.8}
[data-theme="dark"] .note{color:var(--text)}
.note.warn{background:var(--alert-bg); border:1px solid var(--alert-br); color:var(--alert-tx)}

.tbl{background:var(--card); border:1px solid var(--border); border-radius:18px; overflow:hidden}
.tbl .th,.tbl .tr{display:flex; gap:18px; align-items:center; padding:16px 24px}
.tbl .th{background:var(--thead); border-bottom:1px solid var(--border); font-size:14px; font-weight:600; color:var(--muted)}
.tbl .tr{padding:18px 24px; border-bottom:1px solid var(--border); font-size:15px}
.tbl .tr:last-child{border-bottom:none}
.tbl .tr:hover{background:var(--raise)}
.divider{height:1px; background:var(--border)}

/* ---------- site chrome ---------- */
.nav{position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--border);
  transition:box-shadow .25s}
.nav.stuck{box-shadow:var(--shadow-sm)}
.nav-in{max-width:1400px; margin:0 auto; padding:0 var(--pad); height:88px;
  display:flex; align-items:center; gap:24px}
.navlink{font-size:15px; font-weight:600; color:var(--primary); white-space:nowrap}
[data-theme="dark"] .navlink{color:var(--text)}
.brand{display:flex; align-items:center; gap:12px; color:var(--primary)}
.brand:hover{color:var(--primary)}
.logochip{display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  background:#FFFFFF; border-radius:10px; padding:5px}
.logo{display:block; height:100%; width:auto}
.side .logochip,.foot .logochip{box-shadow:0 1px 6px rgba(0,0,0,.18)}
.brand b{font-size:19px; font-weight:700; display:block; line-height:1.3; white-space:nowrap}
.brand .tag{font-size:12px; color:var(--muted); display:block}
.menu{flex-grow:1; display:flex; align-items:center; justify-content:center; gap:22px}
.menu a{font-size:16px; font-weight:500; color:var(--text); padding:8px 2px; border-bottom:2px solid transparent; white-space:nowrap}
.menu a:hover{color:var(--secondary)}
.menu a.on{font-weight:600; color:var(--primary); border-bottom-color:var(--secondary)}
[data-theme="dark"] .menu a.on{color:var(--text)}
.navtools{display:flex; align-items:center; gap:12px}
.iconbtn{width:44px; height:44px; border-radius:10px; border:1px solid var(--border);
  background:var(--card); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer}
.iconbtn:hover{background:var(--raise)}
.langbtn{height:44px; padding:0 14px; border-radius:8px; border:1px solid var(--border);
  background:transparent; color:var(--muted); font-weight:600; font-size:14px; cursor:pointer;
  font-family:'IBM Plex Sans',sans-serif}
.burger{display:none}

.foot{background:var(--primary-dark); color:#fff; padding:64px 0 28px}
[data-theme="dark"] .foot{background:var(--surface); border-top:1px solid var(--border); color:var(--text)}
.foot a{color:#C9E6E4}
[data-theme="dark"] .foot a{color:var(--muted)}
.foot a:hover{color:#fff}
.foot h4{color:#fff; font-size:18px; margin-bottom:6px}
[data-theme="dark"] .foot h4{color:var(--text)}
.foot .fcol{display:flex; flex-direction:column; gap:12px; font-size:15px}
.foot .bot{display:flex; align-items:center; justify-content:space-between; gap:24px;
  border-top:1px solid rgba(255,255,255,.12); margin-top:40px; padding-top:24px; font-size:14px; color:#A2C9C7}
[data-theme="dark"] .foot .bot{border-top-color:var(--border); color:var(--muted)}
.soc{display:flex; gap:12px}
.soc a{width:40px; height:40px; border-radius:10px; border:1px solid rgba(255,255,255,.18);
  display:flex; align-items:center; justify-content:center; color:#C9E6E4}
[data-theme="dark"] .soc a{border-color:var(--border)}

/* ---------- hero ---------- */
.hero{position:relative; overflow:hidden; background:var(--hero); padding:84px 0}
.hero .wrap{position:relative; z-index:1; display:flex; gap:56px; align-items:center}
.hero .lines{position:absolute; inset-inline-start:0; top:0; opacity:.18; pointer-events:none}
[data-theme="dark"] .hero .lines{opacity:.34}
html[dir="ltr"] .hero .lines{transform:scaleX(-1)}
.badge{display:inline-flex; align-items:center; padding:8px 18px; border-radius:999px;
  background:var(--sl); color:var(--primary); font-size:14px; font-weight:600; align-self:flex-start}
[data-theme="dark"] .badge{color:var(--text)}

/* ---------- admin shell ---------- */
.app{display:flex; min-height:100vh; overflow-x:clip}
.side{width:272px; flex-shrink:0; background:var(--sidebar); color:#fff; padding:26px 18px;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto}
[data-theme="dark"] .side{border-inline-end:1px solid var(--border)}
.side .sbrand{display:flex; align-items:center; gap:12px; padding:0 10px 14px; color:#fff}
.side .sbrand b{font-size:16px; font-weight:700; display:block}
.side .sbrand span{font-size:12px; color:#A2C9C7}
.sbh{font-size:11px; font-weight:600; letter-spacing:.1em; color:#6E9B99; padding:18px 12px 8px}
.sbl{display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:10px;
  color:#C9E6E4; font-size:15px; font-weight:500}
.sbl:hover{background:rgba(255,255,255,.06); color:#fff}
.sbl.on{background:var(--secondary); color:var(--on-primary); font-weight:600}
[data-theme="dark"] .sbl{color:var(--muted)}
[data-theme="dark"] .sbl.on{color:var(--on-primary)}
.sbl .badge-n{margin-inline-start:auto; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700}
.main{flex-grow:1; min-width:0; background:var(--app-bg); display:flex; flex-direction:column}
.topbar{height:78px; flex-shrink:0; padding:0 36px; background:var(--card);
  border-bottom:1px solid var(--border); display:flex; align-items:center; gap:22px; position:sticky; top:0; z-index:20}
.topbar .t{font-size:20px; font-weight:600; color:var(--primary); white-space:nowrap}
[data-theme="dark"] .topbar .t{color:var(--text)}
.content{padding:28px 36px; display:flex; flex-direction:column; gap:22px}
.avatar{width:34px; height:34px; border-radius:50%; background:var(--primary); color:var(--on-primary);
  display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0}
.who{display:flex; align-items:center; gap:10px; padding:6px 14px 6px 6px; background:var(--raise);
  border:1px solid var(--border); border-radius:999px; font-size:15px; font-weight:600}
.stat .n{font-size:38px; font-weight:700; color:var(--primary); line-height:1.1}
[data-theme="dark"] .stat .n{color:var(--secondary)}
.bars{height:210px; display:flex; align-items:flex-end; gap:26px}
.bars .b{flex-grow:1; display:flex; flex-direction:column; align-items:center; gap:10px}
.bars .bb{width:100%; display:flex; gap:6px; align-items:flex-end; height:180px}
.bars .bb i{flex-grow:1; border-radius:6px 6px 0 0; display:block}
.toggle{width:52px; height:30px; border-radius:999px; background:var(--border); padding:3px;
  display:flex; align-items:center; cursor:pointer; flex-shrink:0}
.toggle i{width:24px; height:24px; border-radius:50%; background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.35); display:block; transition:margin .2s}
.toggle.on{background:var(--secondary); justify-content:flex-end}
.step{display:flex; gap:20px}
.step .rail{width:40px; flex-shrink:0; display:flex; flex-direction:column; align-items:center}
.step .dot{width:40px; height:40px; border-radius:50%; background:var(--card); border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0}
.step .dot.done{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
.step .dot.now{background:var(--secondary); border:3px solid var(--sl)}
.step .dot.now i{width:10px; height:10px; border-radius:50%; background:var(--on-primary); display:block}
.step .line{width:2px; flex-grow:1; min-height:36px; background:var(--border)}
.step .line.done{background:var(--primary)}
.bar{height:12px; background:var(--raise); border-radius:999px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--secondary)}
.drop{border:1.5px dashed var(--secondary); border-radius:16px; padding:30px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--primary); background:var(--card)}
[data-theme="dark"] .drop{color:var(--text)}

/* ---------- motion ---------- */
.rv{opacity:0; transform:translateY(30px); transition:opacity .6s ease, transform .6s ease}
.rv.in{opacity:1; transform:none}
.page{animation:pg .3s ease both}
@keyframes pg{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
#loader{position:fixed; inset:0; z-index:200; background:var(--bg);
  display:flex; align-items:center; justify-content:center; transition:opacity .4s}
#loader.gone{opacity:0; pointer-events:none}
#loader img{height:132px; width:auto; display:block; opacity:0; transform:scale(.88);
  animation:mark .7s cubic-bezier(.2,.8,.3,1) forwards}
#loader .word{opacity:0; animation:fade .5s ease .55s forwards; font-weight:700; font-size:22px; color:var(--primary)}
#loader .rule{width:0; height:2px; background:var(--secondary); border-radius:2px;
  animation:rule .6s ease .35s forwards}
@keyframes mark{to{opacity:1; transform:none}}
@keyframes rule{to{width:120px}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important; transition-duration:.001s !important}
  .rv{opacity:1; transform:none}
}

/* ---------- responsive ---------- */
@media (max-width:1320px){
  .menu{gap:16px}
  .menu a{font-size:15px}
  .navtools .navlink{display:none}
}
@media (max-width:1100px){
  :root{--pad:28px}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero .wrap{flex-direction:column; align-items:stretch}
  .side{display:none; position:fixed; inset-inline-start:0; top:0; z-index:80; box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{display:flex}
  .content,.topbar{padding-inline:20px}
}
@media (max-width:1100px){
  .menu{display:none}
  .burger{display:flex}
  .navtools .who{display:none}
  .row:not(.keep){flex-direction:column}
  .row:not(.keep)>*{flex:1 1 auto !important; width:100% !important; max-width:none !important}
}
@media (max-width:900px){
  .tbl .th{display:none}
  .tbl .tr{flex-direction:column; align-items:flex-start; gap:8px}
  .tbl .tr>*{width:auto !important}
}
@media (max-width:760px){
  body{font-size:16px}
  :root{--pad:20px}
  .nav-in{height:68px; gap:8px}
  .navtools{gap:8px}
  .iconbtn,.langbtn{width:40px; height:40px; padding:0}
  .langbtn{width:auto; padding:0 10px}
  .brand .tag{display:none}
  .brand b{font-size:16px}
  .hero .btn,.sec.band .btn{width:100%}
  .grid,.g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}
  .row.keep{flex-wrap:wrap}
  .sec{padding:56px 0}
  .hero{padding:44px 0}
  .spread{flex-direction:column; align-items:flex-start}
  .foot .bot{flex-direction:column; align-items:flex-start}
  .navtools .btn{display:none}
  .topbar{height:auto; padding-block:14px; flex-wrap:wrap}
  .drawer{display:flex}
}
@media (max-width:400px){ .brand b{display:none} }
.drawer{display:none; position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.4)}
.drawer.show{display:block}
.drawer .panel{position:absolute; inset-inline-end:0; top:0; bottom:0; width:280px; background:var(--bg);
  padding:24px; display:flex; flex-direction:column; gap:6px}
.drawer .panel .spread{flex-direction:row !important; align-items:center}
.drawer .panel a{padding:14px 12px; border-radius:10px; color:var(--text); font-weight:600}
.drawer .panel a:hover{background:var(--raise)}
</style>
</head>
<body>
<div id="loader">

</div>
<div id="app"></div>
<div class="drawer" id="drawer" onclick="if(event.target.id==='drawer')closeDrawer()"><div class="panel" id="drawerPanel"></div></div>

        <div class="grid g3" style="gap:18px">
          ${['Facebook', 'Instagram', 'X'].map((n, i) => `<div class="field"><label for="so${i}">${n}</label><input id="so${i}" type="url" class="ltr" placeholder="https://"></div>`).join('')}
        </div></div>
      <div class="row keep g14"><button class="btn">${T({ar:'حفظ التغييرات', en:'Save changes'})}</button>
        <button class="btn line">${T({ar:'تراجع', en:'Cancel'})}</button></div>
    </div>
  </div>`;
  return adminShell('admin-settings', {ar:'الإعدادات', en:'Settings'}, {ar:'بيانات الجمعية واللغات والروابط', en:'Organisation, languages and links'}, '', body);
}

/* ============================ router ============================ */
const ROUTES = {
  home: pHome, about: pAbout, board: pBoard, work: pWork, scholarships: pScholar,
  news: pNews, article: pArticle, testimonials: pTestimonials, partners: pPartners,
  documents: pDocuments, contact: pContact, apply: pApply,
  'portal-login': pPortalLogin, 'portal-status': pPortalStatus, 'portal-docs': pPortalDocs,
  admin: aOverview, 'admin-apps': aApps, 'admin-review': aReview, 'admin-messages': aMessages,
  'admin-pages': aPages, 'admin-page': aPageEditor, 'admin-news': aNews, 'admin-work': aWork,
  'admin-board': aBoard, 'admin-testimonials': aTestimonials, 'admin-partners': aPartners,
  'admin-documents': aDocs, 'admin-users': aUsers, 'admin-settings': aSettings
};

function route() {
  const key = (location.hash.replace(/^#\/?/, '') || 'home').split('?')[0];
  const fn = ROUTES[key] || ROUTES.home;
  const app = document.getElementById('app');
  app.innerHTML = `<div class="page">${fn()}</div>`;
  window.scrollTo(0, 0);
  closeDrawer();
  observe();
  document.title = (key === 'home' ? '' : key + ' — ') + T(ORG);
}

function observe() {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = document.querySelectorAll('.rv');
  if (reduce) { items.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), {threshold: .12, rootMargin: '0px 0px -60px 0px'});
  items.forEach(e => io.observe(e));

  document.querySelectorAll('.counter').forEach(el => {
    const target = parseInt(el.dataset.n, 10);
    if (isNaN(target)) return;
    const co = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      co.unobserve(e.target);
      if (reduce) { el.textContent = AR(target); return; }
      let cur = 0; const t0 = performance.now(), dur = 1400;
      const tick = now => {
        const p = Math.min(1, (now - t0) / dur);
        cur = Math.round(target * (1 - Math.pow(1 - p, 3)));
        el.textContent = AR(cur);
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }), {threshold: .4});
    co.observe(el);
  });

  document.querySelectorAll('.toggle').forEach(t => t.addEventListener('click', () => t.classList.toggle('on')));
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    const sibs = c.parentElement.querySelectorAll('.chip');
    sibs.forEach(s => s.classList.remove('on')); c.classList.add('on');
  }));
  document.querySelectorAll('.check').forEach(c => c.addEventListener('click', () => {
    const inp = c.querySelector('input');
    if (inp && inp.type === 'radio') {
      document.querySelectorAll('input[name="' + inp.name + '"]').forEach(r => r.closest('.check') && r.closest('.check').classList.remove('on'));
      c.classList.add('on');
    }
  }));
}

function toggleTheme() {
  const r = document.documentElement;
  const next = r.dataset.theme === 'dark' ? 'light' : 'dark';
  r.dataset.theme = next;
  try { localStorage.setItem('safeer-theme', next); } catch (e) {}
  route();
}
function toggleLang() {
  LANG = LANG === 'ar' ? 'en' : 'ar';
  const r = document.documentElement;
  r.lang = LANG; r.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  try { localStorage.setItem('safeer-lang', LANG); } catch (e) {}
  route();
}
function openDrawer() {
  const p = document.getElementById('drawerPanel');
  p.innerHTML = `<div class="spread" style="margin-bottom:8px"><strong style="color:var(--primary)">${T({ar:'القائمة', en:'Menu'})}</strong>
      <button class="iconbtn" onclick="closeDrawer()" aria-label="close">${ic('x')}</button></div>`
    + NAV.map(([r, l]) => `<a href="#/${r}" onclick="closeDrawer()">${T(l)}</a>`).join('')
    + `<div class="divider" style="margin:8px 0"></div>`
    + `<a href="#/portal-login" onclick="closeDrawer()">${T({ar:'بوابة الطالب', en:'Student portal'})}</a>`
    + `<a href="#/admin" onclick="closeDrawer()">${T({ar:'لوحة التحكم', en:'Dashboard'})}</a>`
    + `<a href="#/apply" onclick="closeDrawer()" style="background:var(--primary);color:var(--on-primary);text-align:center">${T({ar:'قدّم طلب منحة', en:'Apply'})}</a>`;
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer() { const d = document.getElementById('drawer'); if (d) d.classList.remove('show'); }

/* ============================ boot ============================ */
try {
  const th = localStorage.getItem('safeer-theme');
  if (th) document.documentElement.dataset.theme = th;
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  const lg = localStorage.getItem('safeer-lang');
  if (lg) { LANG = lg; document.documentElement.lang = lg; document.documentElement.dir = lg === 'ar' ? 'rtl' : 'ltr'; }
} catch (e) {}

const _ll = document.getElementById('loaderLogo');
if (_ll) _ll.src = LOGO_SRC;

window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => {
  const n = document.getElementById('nav');
  if (n) n.classList.toggle('stuck', window.scrollY > 8);
});
route();
setTimeout(() => {
  const l = document.getElementById('loader');
  if (l) { l.classList.add('gone'); setTimeout(() => l.remove(), 500); }
}, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1250);

</script>
</body>
