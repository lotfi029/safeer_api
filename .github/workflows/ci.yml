name: CI

# 26-backend-code-review.md Task 6.1: no CI existed in this repo at all —
# a stale openapi.json sat two days behind every source file through an
# entire remediation pass with nothing to catch it. This adds a build +
# lint + openapi-contract + boot-and-smoke pipeline against a real MySQL
# service, since "nest build succeeding" has masked a broken app here
# before (see the project's own notes on that).

on:
  push:
    branches: [main]
  pull_request:

# C44: the workflow only reads the repository; the token gets nothing more.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # MySQL 8.0 — the database.module.ts charset comment explains why the
      # exact collation (utf8mb4_unicode_ci, used everywhere in this repo
      # so it also works unchanged on Hostinger's MariaDB) matters: a
      # mismatch breaks any query mixing a string literal with a table
      # column with "Illegal mix of collations" and silently drops Arabic
      # accent-insensitivity.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: safeer
          # C9: the server's own clock runs off-UTC (UTC+3, POSIX form so it
          # needs no zoneinfo files), like a MariaDB set to the association's
          # local time would. The app, migrate.mjs and the tests must pin
          # every connection to UTC regardless; test/utc.spec.ts fails if not.
          TZ: '<+03>-3'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # NODE_ENV=development (not test/staging) so migrate.mjs includes
      # migrations/dev/003_dev_sample.sql — the legacy-news bulk-delete
      # smoke case needs that seeded data (the 3 "legacy template" posts)
      # to have anything to act on.
      NODE_ENV: development
      PORT: 3900
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: safeer
      SESSION_COOKIE_NAME: sf_sid
      SESSION_IDLE_HOURS: '8'
      SESSION_ABSOLUTE_DAYS: '30'
      # CI-only value, not a real secret — no production data ever touches
      # this database. Generated once with the same command env.ts's own
      # comment gives (`node -e "console.log(require('crypto').
      # randomBytes(32).toString('base64'))"`).
      APP_ENCRYPTION_KEY: ukhiU9W4qpmJr9pwnzL01FaECwZTTOF3Y2vPKga7xrk=
      STORAGE_ROOT: ./var/assets
      BOOTSTRAP_ADMIN_EMAIL: admin@safeer-sa.org
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-password-not-a-secret
      IP_HASH_SALT: ci-only-salt-not-a-secret
      CORS_ORIGINS: http://localhost:4200
      FRONTEND_BASE_URL: http://localhost:4200
      CACHE_TTL_SECONDS: '60'
      CACHE_MAX_ENTRIES: '500'
      # B0-5: refused outright if NODE_ENV=production — safe here since
      # NODE_ENV is development. Not load-bearing for the smoke suite's own
      # role-gate cases (scripts/smoke.mjs creates its own temporary
      # editor/reviewer/support accounts by direct row insert, since
      # 002_seed.sql/dev/003_dev_sample.sql seed zero users on purpose — the
      # only account either ever produces is the bootstrap admin below), but
      # left on for parity with a real dev environment.
      ALLOW_DEV_PASSWORD_FIXUP: 'true'

    # C44: third-party actions are pinned to a full commit SHA (the tag
    # can be moved; the SHA can't). Update both together.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Node 22, not 20: jsdom 30 (loaded at module scope by
      # markdown.service.ts), file-type 22 (media.service.ts) and undici 8
      # all declare engines >=22, and undici reaches for
      # worker_threads.markAsUncloneable, which only exists from v22.10.0.
      # On Node 20 `npm ci` still installs — engines are advisory — and the
      # break surfaces later as "markAsUncloneable is not a function" the
      # first time anything imports jsdom: openapi:check here, and the API
      # boot step right after it. Keep at or above package.json engines.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent && break
            sleep 1
          done

      - run: npm run migrate

      # C44: migrations are idempotent — a second run must apply nothing
      # (and its checksum pass must accept every file it just applied).
      - name: Migrate again (must be a no-op)
        run: npm run migrate | tee migrate-2.log && grep -q 'Nothing to migrate' migrate-2.log

      # C44: the entities match the migrated schema (scripts/check-schema.mjs).
      - run: npm run schema:check

      # C44: the production path on a fresh database — only the numbered
      # files, never migrations/dev/, through MIGRATION_DB_USER (required
      # outside development/test), and again a no-op second run.
      - name: Migrate a fresh database as production
        env:
          NODE_ENV: production
          DB_NAME: safeer_prod
          MIGRATION_DB_USER: root
          MIGRATION_DB_PASSWORD: ''
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e 'CREATE DATABASE safeer_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          npm run migrate
          dev_rows=$(mysql -h 127.0.0.1 -P 3306 -u root -N -e "SELECT COUNT(*) FROM safeer_prod.schema_migrations WHERE version = '003_dev_sample.sql'")
          applications=$(mysql -h 127.0.0.1 -P 3306 -u root -N -e 'SELECT COUNT(*) FROM safeer_prod.applications')
          test "$dev_rows" = 0 && test "$applications" = 0 || { echo "dev fixtures reached a production migrate"; exit 1; }
          npm run migrate | tee migrate-prod-2.log && grep -q 'Nothing to migrate' migrate-prod-2.log
          DB_NAME=safeer_prod NODE_ENV=development npm run schema:check

      # Phase 6 (safeer-backend-fix-prompt.md): Jest + supertest-style HTTP
      # tests against a real, dedicated MySQL database and a real running
      # instance of the app — both created and booted in
      # test/global-setup.ts, entirely separately from the CI-wide
      # database/API below. No ORM mock.
      - run: npm test

      # openapi.json must reflect what's actually implemented in source at
      # HEAD, every time — a stale contract is exactly what
      # export-openapi.mjs's own header warns about, and any generated
      # frontend API client depends on it.
      - run: npm run openapi:check

      # B4/B5/B17 sweep: every admin/* route must be gated by its
      # role-matrix area or be on the explicit allow-list — see
      # scripts/lib/check-admin-roles.mjs.
      - run: npm run check:admin-roles

      - name: Boot the API
        run: |
          node --enable-source-maps dist/main.js > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3900/health > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy in time"
          cat api.log
          exit 1

      # A clean build is not a working app (this project's own recorded
      # lesson, three times over) — boot the process and hit the endpoint,
      # via the extended smoke suite, rather than trusting the build alone.
      # C8: smoke refuses to touch a database it wasn't explicitly pointed at.
      - run: npm run smoke -- --confirm=safeer

      - name: API logs (always, for debugging)
        if: always()
        run: cat api.log || true

      - name: Stop the API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true
