name: VPS deploy

# Builds safeer-api's image, pushes it to GHCR as :<12-hex commit> (and
# :latest from main), then releases it on the VPS over SSH:
#   /srv/safeer/deploy.sh api <tag>
# which pulls, refuses while that image has pending migrations, swaps, waits
# for /health/ready, and otherwise rolls back (docs/backend/DEPLOYMENT-VPS.md,
# "Auto-deploy"). A release with a migration goes red here on purpose, with
# the old API still serving; run `./deploy.sh migrate <tag> && ./deploy.sh api
# <tag>` on the VPS.
#
# Runs on push only once the repository variable VPS_ENABLED is "true". Before
# that, a manual run builds and pushes without deploying. image.yml keeps
# publishing the v* release tags.
# Repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy-api
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/lotfi029/safeer-api

jobs:
  build:
    if: vars.VPS_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # Pinned to the same commit SHAs as image.yml (C44).
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Only main moves :latest. A manual run from a branch still pushes
          # its own commit tag, for testing.
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    needs: build
    # Only main ships, whatever triggered the run.
    if: vars.VPS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Release on the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -e
          for v in SSH_KEY KNOWN_HOSTS VPS_USER VPS_HOST; do
            [ -n "${!v}" ] || { echo "::error::repository secret for $v is empty (Settings -> Secrets and variables -> Actions -> Repository secrets)"; exit 1; }
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "api $TAG"
