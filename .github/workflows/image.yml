name: Image

# Publishes the production image the VPS pulls (docs/backend/DEPLOYMENT-VPS.md):
#   ghcr.io/lotfi029/safeer-api:<tag>         on a v* tag (e.g. v1.0.0)
#   ghcr.io/lotfi029/safeer-api:sha-<short>   always
# A manual run (workflow_dispatch) on a branch publishes only the sha- tag.
# Every PR already builds and checks the same Dockerfile against mysql:8.4
# (ci.yml's `image` job); this workflow only publishes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# C44: least privilege — read the repo, write the package. Nothing else.
permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # C44: third-party actions are pinned to a full commit SHA (the tag
    # can be moved; the SHA can't). Update both together.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also sets the OCI labels, org.opencontainers.image.source among them,
      # which links the GHCR package to this repository.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/lotfi029/safeer-api
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=safeer-api
            org.opencontainers.image.description=Safeer API (NestJS + MySQL 8.4)

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
